<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 내 마음의 풍경 | 마음별</title>
<style>
*{box-sizing:border-box} [hidden]{display:none!important}
:root{color:#303e40;background:#f5f1e9;font-family:system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.65}
body{margin:0}main{max-width:1130px;margin:0 auto;padding:28px 18px 110px}
header{padding:22px 0 20px;border-bottom:1px solid #d5cec2;margin-bottom:20px}
h1,h2,h3,p{margin:0}h1{font-family:Georgia,Batang,serif;font-size:clamp(2rem,5.5vw,3.5rem);font-weight:600;line-height:1.3;letter-spacing:-.055em;color:#344b4b}
header p{margin-top:12px;color:#535851}h2{font-size:1.45rem}h3{font-size:1.15rem}button,input{font:inherit}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.scene{position:relative;display:flex;flex-direction:column;align-items:stretch;background:#fffdf8;border:2px solid transparent;border-radius:14px;overflow:hidden;text-align:left;padding:4px;cursor:pointer;color:#303e40;box-shadow:0 2px 8px #393b3010}
.scene img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block}
.scene strong{display:block;padding:9px 8px 12px;font-size:1rem;line-height:1.4;word-break:keep-all}
.scene[aria-pressed=true]{border-color:#365b58;background:#e5eee5;box-shadow:0 0 0 2px #365b5822}
.badge{position:absolute;top:12px;right:12px;min-width:32px;line-height:32px;padding:0 5px;border-radius:50%;background:#365b58;color:white;text-align:center;font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid #744e7e;outline-offset:3px}
.actionbar{position:sticky;bottom:0;margin:18px -6px 0;padding:12px;background:#fffdf8;border:1px solid #d5cec2;border-radius:16px;box-shadow:0 -3px 20px #45433612;z-index:2}
#status{font-size:.95rem;color:#394d49;margin-bottom:8px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.control{min-height:48px;border:1px solid #66817c;border-radius:10px;background:#fffdf8;padding:9px 16px;color:#344b4b;cursor:pointer;font-weight:600}
.primary{color:white;background:#365b58;flex:1}
.primary:disabled{background:#dce5de;color:#52635a;cursor:default;border-color:#bac8bc}
#result{scroll-margin-top:16px}#result h2{margin:0 0 8px}
.reflections{display:grid;gap:16px;margin:20px 0;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.reflect{background:#fffdf8;padding:16px;border:1px solid #d5cec2;border-radius:16px}
.reflect img{display:block;width:100%;max-width:440px;aspect-ratio:1;object-fit:cover;border-radius:10px;margin:0 auto 12px}
.reflect p{margin:10px 0;color:#50554c}
.reflect label{display:block;margin:12px 0 6px;font-weight:600}
.reflect input,textarea{display:block;width:100%;padding:12px;border-radius:8px;border:1px solid #82928a;background:#fffcf5;color:#303e40;font:inherit}
.hints{margin-top:10px}.hints summary{cursor:pointer;color:#405b56}.words{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.word{border:1px solid #aebfb2;border-radius:24px;background:#f0f4ed;padding:6px 12px;min-height:42px;color:#344b4b;cursor:pointer}
.note{margin:16px 0;background:#e7ede4;padding:18px;border-radius:12px;font-size:clamp(1rem,3.5vw,1.3rem);white-space:pre-wrap;overflow-wrap:anywhere}
footer{margin-top:20px;color:#5c6259;font-size:.85rem}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){main{padding:16px 10px 70px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.scene strong{font-size:.95rem;padding:8px 5px 10px}.actionbar{margin-inline:0;padding:10px}.control{padding:9px 12px}}
</style>
</head>
<body>
<main>
<header><h1>오늘 내 마음의 풍경</h1><p>오늘 마음에 머무는 장면을 한 장 또는 두 장 골라보세요.</p></header>
<section id="picker" aria-label="풍경 카드 고르기">
<div class="grid" id="grid"></div>
<div class="actionbar"><p id="status" role="status">선택한 풍경 0 / 2</p>
<div class="actions"><button class="control primary" id="reveal" disabled>내 마음에 이름 붙이기</button><button class="control" id="reset">다시 고르기</button></div></div>
</section>
<section id="result" hidden aria-labelledby="result-title">
<h2 id="result-title" tabindex="-1">내 마음에 이름 붙이기</h2>
<p id="question"></p>
<div class="reflections" id="reflections"></div>
<div class="note" id="note" role="status" hidden></div>
<div class="actions"><button class="control" id="back">풍경 다시 보기</button><button class="control" id="start-over">새로 시작하기</button></div>
</section>
<footer>마음별 · 웰다잉통합예술교육협회</footer>
</main>
<script>window.maeumImages=[];</script>
<script src="maeum-weather-assets/card-01.js"></script>
<script src="maeum-weather-assets/card-02.js"></script>
<script src="maeum-weather-assets/card-03.js"></script>
<script src="maeum-weather-assets/card-04.js"></script>
<script src="maeum-weather-assets/card-05.js"></script>
<script src="maeum-weather-assets/card-06.js"></script>
<script src="maeum-weather-assets/card-07.js"></script>
<script src="maeum-weather-assets/card-08.js"></script>
<script src="maeum-weather-assets/card-09.js"></script>
<script src="maeum-weather-assets/card-10.js"></script>
<script src="maeum-weather-assets/card-11.js"></script>
<script src="maeum-weather-assets/card-12.js"></script>
<script src="maeum-weather-assets/card-13.js"></script>
<script src="maeum-weather-assets/card-14.js"></script>
<script src="maeum-weather-assets/card-15.js"></script>
<script src="maeum-weather-assets/card-16.js"></script>
<script src="maeum-weather-assets/card-17.js"></script>
<script src="maeum-weather-assets/card-18.js"></script>
<script src="maeum-weather-assets/card-19.js"></script>
<script src="maeum-weather-assets/card-20.js"></script>
<script src="maeum-weather-assets/card-21.js"></script>
<script src="maeum-weather-assets/card-22.js"></script>
<script src="maeum-weather-assets/card-23.js"></script>
<script src="maeum-weather-assets/card-24.js"></script>
<script>
const cards = [{"title": "우산을 쓰고 걷는 길", "description": "빗방울이 우산 위를 두드려요. 바람이 불 때마다 빗물이 옆으로 들어와 한쪽 어깨가 젖어요.", "image": window.maeumImages[0]}, {"title": "창 안에서 바라보는 비", "description": "빗방울이 유리창을 타고 흘러요. 창밖으로 우산을 쓴 사람들이 지나가고, 내 손에는 따뜻한 찻잔이 있어요.", "image": window.maeumImages[1]}, {"title": "처마 아래에서 기다리는 소나기", "description": "가게 처마 아래에 잠깐 멈춰 섰어요. 빗물이 발끝 바로 앞에 떨어져 작은 물길을 만들어요.", "image": window.maeumImages[2]}, {"title": "웅덩이에 비친 맑은 하늘", "description": "비가 그친 골목을 걷다가 발치의 웅덩이를 내려다봐요. 고인 물에 파란 하늘과 흰 구름이 비쳐요.", "image": window.maeumImages[3]}, {"title": "빗속에 우산 하나를 나눠 쓰는 길", "description": "두 사람이 우산 하나 아래에서 걸어요. 좁은 길에 들어서자 걸음이 달라져 잠시 보폭을 맞춰요.", "image": window.maeumImages[4]}, {"title": "비가 오는데 해가 뜬 골목", "description": "골목 끝은 햇빛에 환한데, 내가 서 있는 곳에는 가는 비가 내려요. 햇빛을 받은 빗방울이 잠깐 반짝여요.", "image": window.maeumImages[5]}, {"title": "안개 속 정류장", "description": "정류장 표지판은 가까이 보이고, 버스가 올 길은 안개에 가려 있어요. 멀리서 엔진 소리가 조금씩 가까워져요.", "image": window.maeumImages[6]}, {"title": "안개가 걷히는 다리", "description": "다리 위에 서서 난간 아래를 내려다봐요. 안개 사이로 물이 흐르는 소리가 먼저 들리고, 조금 뒤에 건너편 둔치가 보여요.", "image": window.maeumImages[7]}, {"title": "구름 그림자가 지나가는 언덕", "description": "언덕에 앉아 있는데 큰 구름 하나가 해를 가려요. 발밑이 서늘해졌다가, 구름 그림자가 멀어지면서 볕이 돌아와요.", "image": window.maeumImages[8]}, {"title": "구름 낮게 깔린 운동장", "description": "운동장 가장자리를 천천히 걸어요. 낮게 깔린 구름 아래로 아이들이 차는 공 소리가 일정한 간격으로 들려요.", "image": window.maeumImages[9]}, {"title": "바람에 펄럭이는 빨랫줄", "description": "빨랫줄에 널어 둔 셔츠가 바람에 크게 부풀어요. 옷자락이 뒤집힐 때마다 집게가 빨랫줄에 부딪혀요.", "image": window.maeumImages[10]}, {"title": "맞바람을 안고 건너는 다리", "description": "다리 한가운데서 바람이 정면으로 불어요. 모자 챙을 한 손으로 누르고, 난간을 따라 한 걸음씩 걸어요.", "image": window.maeumImages[11]}, {"title": "문을 열자 들어오는 저녁 바람", "description": "하루 종일 닫혀 있던 베란다 문을 열어요. 서늘한 바람이 팔에 닿고, 식탁 위 종이 한 장이 들썩여요.", "image": window.maeumImages[12]}, {"title": "바람이 잦아든 뒤의 마당", "description": "조금 전까지 흔들리던 나뭇가지가 멈춰 있어요. 마당 한쪽에 바람에 밀려온 잎들이 모여 있어요.", "image": window.maeumImages[13]}, {"title": "볕이 드는 식탁", "description": "오후 볕이 식탁 한쪽을 데워요. 찻잔을 조금 옆으로 옮기고, 따뜻해진 자리에 손바닥을 올려요.", "image": window.maeumImages[14]}, {"title": "한낮의 그늘을 옮겨 다니는 길", "description": "햇빛이 강한 날, 나무 그늘에서 건물 그늘까지 걸어요. 그늘에 들어설 때마다 목덜미에 닿는 열기가 줄어요.", "image": window.maeumImages[15]}, {"title": "해가 진 뒤의 벤치", "description": "해가 넘어가고 앉아 있던 벤치가 서늘해져요. 건너편 집들의 창문에 하나둘 불이 켜져요.", "image": window.maeumImages[16]}, {"title": "추운 아침, 장갑을 끼는 현관", "description": "문을 열자 찬 공기가 얼굴에 닿아요. 현관에 잠깐 서서 장갑을 끼고, 아직 차가운 손잡이를 잡아요.", "image": window.maeumImages[17]}, {"title": "첫눈이 내리는 버스 안", "description": "버스가 신호에 멈춰요. 창밖 가로등 아래에서 눈송이가 보이고, 몇 송이는 유리창에 닿자마자 녹아요.", "image": window.maeumImages[18]}, {"title": "눈길 위에 나란히 남는 발자국", "description": "밤새 눈이 내린 길에 먼저 지나간 사람의 발자국이 있어요. 그 옆을 걷자 내 발밑에서도 눈 밟는 소리가 나요.", "image": window.maeumImages[19]}, {"title": "녹은 눈이 다시 언 골목", "description": "낮에 녹았던 눈이 저녁이 되자 얇게 얼었어요. 반짝이는 부분 앞에서 걸음을 늦추고, 발을 디딜 자리를 살펴요.", "image": window.maeumImages[20]}, {"title": "천둥이 울릴 때 식탁에 앉아", "description": "번개가 번쩍이고 조금 뒤에 천둥이 울려요. 식탁에 앉아 빗소리 사이로 다음 천둥이 들려오는 간격을 가만히 세어요.", "image": window.maeumImages[21]}, {"title": "폭풍이 지나간 다음 날의 길", "description": "아침에 밖으로 나가니 작은 가지와 젖은 잎이 길에 떨어져 있어요. 고인 물을 피해 걸으면서 새가 우는 소리를 들어요.", "image": window.maeumImages[22]}, {"title": "구름이 걷힌 밤, 올려다본 하늘", "description": "밤에 잠깐 밖으로 나와 하늘을 올려다봐요. 처음엔 별 하나만 보이다가, 눈이 어둠에 익으면서 그 옆에도 작은 별이 보여요.", "image": window.maeumImages[23]}];
const hints = ["기쁨","평온함","안도","고마움","설렘","그리움","슬픔","외로움","막막함","불안","답답함","서운함","분노","지침","아쉬움","기대","용기","혼란","무덤덤함","편안함"];
const selection=[];
const feelings=new Map();
const grid=document.getElementById("grid"),picker=document.getElementById("picker"),status=document.getElementById("status"),reveal=document.getElementById("reveal"),result=document.getElementById("result"),reflections=document.getElementById("reflections"),note=document.getElementById("note");
const buttons=cards.map((card,i)=>{
  const button=document.createElement("button");
  button.type="button";button.className="scene";button.setAttribute("aria-pressed","false");
  button.setAttribute("aria-label",card.title+". "+card.description);
  const img=document.createElement("img");img.src=card.image;img.alt="";img.loading="lazy";img.decoding="async";img.width=800;img.height=800;
  const title=document.createElement("strong");title.textContent=card.title;
  const badge=document.createElement("span");badge.className="badge";badge.hidden=true;badge.setAttribute("aria-hidden","true");
  button.append(img,title,badge);button.addEventListener("click",()=>toggle(i));grid.append(button);return {button,badge};
});
function update(){
  buttons.forEach(({button,badge},i)=>{const order=selection.indexOf(i)+1;button.setAttribute("aria-pressed",String(order>0));badge.hidden=!order;badge.textContent=order||"";});
  reveal.disabled=!selection.length;
  status.textContent="선택한 풍경 "+selection.length+" / 2"+(selection.length?" · "+selection.map(i=>cards[i].title).join(" · "):"");
}
function toggle(i){
  const pos=selection.indexOf(i);
  if(pos>=0){selection.splice(pos,1);feelings.delete(i);}
  else if(selection.length<2){selection.push(i);}
  else {status.textContent="두 장까지 고를 수 있어요. 바꾸려면 고른 장면을 다시 눌러주세요.";return;}
  update();
}
function updateNote(){
  const values=selection.map(i=>(feelings.get(i)||"").trim()).filter(Boolean);
  note.hidden=!values.length;
  note.textContent=values.length===2?"오늘 내 마음에는 ‘"+values[0]+"’도 있고, ‘"+values[1]+"’도 있어요.":values.length?"오늘 내 마음의 이름은 ‘"+values[0]+"’이에요.":"";
}
function showResult(){
  if(!selection.length)return;
  document.getElementById("question").textContent=selection.length===1?"이 장면에서 어디에 마음이 머물렀나요? 그 마음에 이름을 붙인다면요?":"두 장면이 지금 내 마음에 함께 있다면, 각각 어떤 이름을 붙이고 싶나요?";
  reflections.replaceChildren();
  selection.forEach(i=>{
    const item=cards[i],panel=document.createElement("article");panel.className="reflect";
    const img=document.createElement("img");img.src=item.image;img.alt=item.title;img.width=800;img.height=800;
    const title=document.createElement("h3");title.textContent=item.title;
    const desc=document.createElement("p");desc.textContent=item.description;
    const label=document.createElement("label");label.htmlFor="feeling-"+i;label.textContent="이 장면에서 떠오른 마음의 이름";
    const input=document.createElement("input");input.id=label.htmlFor;input.placeholder="예: 그리움, 조금 놓이는 마음";input.value=feelings.get(i)||"";input.addEventListener("input",()=>{feelings.set(i,input.value);updateNote();});
    const details=document.createElement("details");details.className="hints";
    const summary=document.createElement("summary");summary.textContent="감정 단어 힌트 보기";
    const words=document.createElement("div");words.className="words";
    hints.forEach(word=>{const b=document.createElement("button");b.type="button";b.className="word";b.textContent=word;b.addEventListener("click",()=>{input.value=word;feelings.set(i,word);updateNote();input.focus();});words.append(b);});
    details.append(summary,words);panel.append(img,title,desc,label,input,details);reflections.append(panel);
  });
  updateNote();picker.hidden=true;result.hidden=false;document.getElementById("result-title").focus();window.scrollTo(0,0);
}
function back(){result.hidden=true;picker.hidden=false;reveal.focus();}
function reset(){selection.length=0;feelings.clear();reflections.replaceChildren();note.hidden=true;note.textContent="";result.hidden=true;picker.hidden=false;update();buttons[0].button.focus();window.scrollTo(0,0);}
reveal.addEventListener("click",showResult);
document.getElementById("reset").addEventListener("click",reset);
document.getElementById("back").addEventListener("click",back);
document.getElementById("start-over").addEventListener("click",reset);
update();
</script>
</body>
</html>
