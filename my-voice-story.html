<!DOCTYPE html>
<html lang="ko" data-theme="light" data-size="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 목소리, 한 장의 이야기</title>
<meta name="description" content="말로 쓰는 한 장의 자서전. 곁에서 돕는 분이 질문을 읽어드리고, 말한 것이 글과 목소리로 남습니다.">
<style>
:root{
  --bg:#FFFFFF; --panel:#EEF1FA; --fg:#000000; --muted:#2B2B2B; --line:#000000;
  --accent:#1B2A8A; --on-accent:#FFFFFF; --rec:#B00020; --on-rec:#FFFFFF; --mark:#FFE9A8;
  --gothic:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Nanum Gothic",sans-serif;
  --myeongjo:"Nanum Myeongjo","NanumMyeongjo","AppleMyungjo","Noto Serif KR","Batang","바탕",serif;
}
html[data-theme="dark"]{
  --bg:#000000; --panel:#141414; --fg:#FFFFFF; --muted:#E6E6E6; --line:#FFFFFF;
  --accent:#FFD400; --on-accent:#000000; --rec:#FF6B7D; --on-rec:#000000; --mark:#3A3000;
}
html[data-size="0"]{font-size:20px}
html[data-size="1"]{font-size:24px}
html[data-size="2"]{font-size:28px}
html[data-size="3"]{font-size:34px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--gothic);font-weight:500;
  line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ul,ol{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--fg);outline-offset:4px}
[tabindex="-1"]:focus{outline:none}

.skip{position:absolute;left:-999rem;top:0;background:var(--accent);color:var(--on-accent);padding:.6rem 1rem;font-weight:700;z-index:20}
.skip:focus{left:0}

.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;
  padding:.6rem 1rem;border-bottom:3px solid var(--line)}
.bar-group{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.bar .btn{min-height:2.6rem;padding:.3rem .8rem;font-size:.85rem}

main{max-width:44rem;margin:0 auto;padding:1.5rem 1rem 6rem}
main > * + *{margin-top:1.5rem}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3.2rem;padding:.5rem 1.2rem;
  border:3px solid var(--line);border-radius:.5rem;background:var(--bg);color:var(--fg);
  font-weight:700;font-size:1rem;cursor:pointer;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.wide{width:100%}
.btn.big{min-height:4.2rem;font-size:1.2rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem}
.stack{display:grid;gap:.8rem}

.title{font-size:2.1rem;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.subtitle{font-size:1.15rem;font-weight:700;margin-top:.4rem}
.lead{font-size:1.1rem}
.h2{font-size:1.3rem;font-weight:800;line-height:1.35}
.note{color:var(--muted);font-size:.9rem}

.box{border:3px solid var(--line);border-radius:.6rem;padding:1.1rem;background:var(--panel)}
.box > * + *{margin-top:.8rem}
.plain-list{padding-left:1.3rem}
.plain-list li + li{margin-top:.5rem}

label.field{display:block;font-weight:700}
label.field span{display:block;font-weight:500;font-size:.9rem;color:var(--muted)}
input[type="text"],textarea{width:100%;margin-top:.4rem;padding:.7rem .8rem;border:3px solid var(--line);
  border-radius:.5rem;background:var(--bg);color:var(--fg);font-size:1.05rem;line-height:1.7}
textarea{resize:vertical;min-height:7rem}
textarea[readonly]{background:var(--mark)}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:700;padding:0;margin-bottom:.4rem}
.choice{display:flex;align-items:center;gap:.6rem;min-height:2.8rem;font-weight:700}
.choice input{width:1.5rem;height:1.5rem;accent-color:var(--accent);flex:none}

/* 질문 화면 */
.progress{font-weight:700;font-size:1rem}
.dots{display:flex;gap:.4rem;margin-top:.5rem}
.dots i{display:block;height:.7rem;flex:1;border:3px solid var(--line);border-radius:.2rem}
.dots i.done{background:var(--fg)}
.dots i.now{background:var(--accent);border-color:var(--accent)}
.question{font-size:1.9rem;line-height:1.35;font-weight:800;letter-spacing:-.01em}

.rec{width:100%;min-height:4.6rem;border:4px solid var(--accent);border-radius:.6rem;background:var(--accent);
  color:var(--on-accent);font-size:1.3rem;font-weight:800;cursor:pointer}
.rec.on{background:var(--rec);border-color:var(--rec);color:var(--on-rec);
  background-image:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.18) 14px 28px)}
.status{font-weight:700;min-height:1.65em}
.count{font-weight:700}
.count.over{color:var(--rec)}
.takes{display:grid;gap:.5rem}
.take{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-weight:700}
.take audio{flex:1;min-width:14rem;height:2.8rem}
.criteria{white-space:pre-wrap;font-size:.9rem;border:3px solid var(--line);border-radius:.5rem;padding:.8rem;background:var(--bg);margin-top:.6rem}
details summary{cursor:pointer}
.stepnav{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stepnav .next{grid-column:1 / -1}

.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);width:min(40rem,calc(100% - 2rem));
  padding:.8rem 1rem;border:3px solid var(--line);border-radius:.5rem;background:var(--fg);color:var(--bg);
  font-weight:700;z-index:10}
.toast:empty{display:none}

/* 한 장 */
.preview{border:3px solid var(--line);overflow:hidden;background:#fff}
.sheet{width:210mm;height:297mm;padding:20mm 22mm;background:#fff;color:#000;font-family:var(--myeongjo);
  font-size:12pt;font-weight:400;line-height:1.8;transform-origin:top left}
.sheet-body{height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet-body > *{flex:none}
.sh-head{text-align:center;border-bottom:1.5pt solid #000;padding-bottom:.9em}
.sh-kicker{font-size:.82em;letter-spacing:.18em}
.sh-name{font-size:1.9em;font-weight:700;line-height:1.3;margin-top:.15em}
.sh-sec h4{font-family:var(--gothic);font-size:.82em;font-weight:700;margin:1.15em 0 .2em}
.sh-sec p{text-align:justify}
.sh-quote{margin-top:1.4em;padding:.8em 0;border-top:.75pt solid #000;border-bottom:.75pt solid #000;
  text-align:center;font-size:1.12em;font-weight:700}
.sh-foot{margin-top:auto;padding-top:1.2em;font-size:.78em;text-align:right;line-height:1.6}
.sh-empty{margin-top:3em;text-align:center}
.sheet.large{height:auto;font-size:18pt !important;line-height:1.9}
.sheet.large .sheet-body{height:auto;overflow:visible}
.sheet.large .sh-foot{margin-top:2em}

#print-root{display:none}
@media (prefers-reduced-motion:no-preference){
  .rec.on{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 .5rem color-mix(in srgb,var(--rec) 30%,transparent)}}
}
@media (max-width:30rem){
  .title{font-size:1.7rem}.question{font-size:1.55rem}
}
@media print{
  html{font-size:12pt}
  body{background:#fff}
  .bar,main,.toast,.skip{display:none !important}
  #print-root{display:block}
  #print-root .sheet{transform:none !important;width:auto;height:auto;padding:0}
  #print-root .sheet-body{display:block;height:auto;overflow:visible}
  #print-root .sh-foot{margin-top:2em}
}
</style>
<style id="page-style">@page{size:A4;margin:18mm}</style>
</head>
<body>
<a class="skip" href="#main">본문으로 바로 가기</a>

<header class="bar">
  <div class="bar-group">
    <button class="btn" type="button" data-action="home">처음 화면</button>
  </div>
  <div class="bar-group" role="group" aria-label="화면 설정">
    <button class="btn" type="button" data-action="smaller" aria-label="글자 작게">글자 작게</button>
    <button class="btn" type="button" data-action="bigger" aria-label="글자 크게">글자 크게</button>
    <button class="btn" type="button" data-action="theme" id="theme-btn">어두운 바탕</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript><p class="lead">이 워크북은 자바스크립트가 켜져 있어야 쓸 수 있습니다.</p></noscript>
</main>

<div id="live" class="toast" role="status" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>

<script>
(function(){
'use strict';

/* ───────── 질문 ───────── */
var QUESTIONS = [
  { key:'기억', head:'내 어린 시절의 장면',
    q:'가장 먼저 떠오르는 어린 시절의 장면을 들려주세요.',
    probes:['그 집에서 가장 기억나는 소리는 무엇인가요?','그때 어떤 냄새가 났나요?','그 장면에 누가 함께 있었나요?'] },
  { key:'빛', head:'내 삶에서 가장 빛났던 순간',
    q:'살면서 가장 행복하거나 빛났던 순간은 언제였나요?',
    probes:['그날 곁에 누가 있었나요?','그때 들었던 말이나 소리가 기억나시나요?','그 순간 몸은 어떤 느낌이었나요?'] },
  { key:'견딤', head:'나를 견디게 한 것',
    q:'힘든 시간을 어떻게 살아내셨나요?',
    care:'말하기 힘든 이야기라면 건너뛰어도 됩니다. 중간에 멈추고 쉬어가도 괜찮습니다.',
    probes:['그때 나를 버티게 해준 것은 무엇이었나요?','그 시절 곁에 있어준 사람이 있었나요?','그 시간을 지나온 나에게 어떤 말을 해주고 싶으신가요?'] },
  { key:'사람', head:'잊을 수 없는 사람',
    q:'당신의 삶에서 잊을 수 없는 사람은 누구인가요?',
    probes:['그분을 떠올리면 가장 먼저 생각나는 목소리나 말씀이 있나요?','그분과 함께 먹던 음식이나 함께 가던 곳이 있나요?','그분께 못다 한 말이 있나요?'] },
  { key:'나', head:'나는 이런 사람이었다',
    q:'돌아보니 나는 어떤 사람으로 살아온 것 같습니까?',
    probes:['끝까지 지키려고 한 것은 무엇이었나요?','사람들은 나를 어떤 사람이라고 했나요?','"나는 무엇무엇 한 사람이었다"로 말해본다면 어떻게 될까요?'] },
  { key:'남김', head:'사랑하는 이들에게',
    q:'사랑하는 사람이나 다음 세대에게 꼭 남기고 싶은 말이 있나요?',
    probes:['누구에게 가장 먼저 전하고 싶으신가요?','살아보니 이것만은 중요하더라 하는 것이 있나요?','고맙다는 말을 전하고 싶은 사람이 있나요?'] }
];
var ORD = ['첫','둘','셋','넷','다섯','여섯'];
var PER_Q = 200, PER_PAGE = 1300;

/* ───────── 환경 ───────── */
var KEY = 'voice-story-v1';
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
var CAN_REC = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
var main = document.getElementById('main');
var live = document.getElementById('live');
var printRoot = document.getElementById('print-root');

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ───────── 상태 ───────── */
function blank(){
  var dark = false;
  try{ dark = window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){}
  return { name:'', helper:'', step:0, oneLine:'',
    answers: QUESTIONS.map(function(){ return {first:'', final:'', skipped:false}; }),
    settings:{ size:1, theme: dark?'dark':'light', rate:0.85, keepAudio:!IS_MOBILE, largePrint:false, maskName:true } };
}
function load(){
  var b = blank();
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return b;
    var d = JSON.parse(raw);
    b.name = d.name || ''; b.helper = d.helper || ''; b.oneLine = d.oneLine || '';
    b.step = Math.min(Math.max(parseInt(d.step,10)||0,0),QUESTIONS.length-1);
    (d.answers||[]).forEach(function(a,i){ if(b.answers[i] && a){ b.answers[i].first=a.first||''; b.answers[i].final=a.final||''; b.answers[i].skipped=!!a.skipped; } });
    if(d.settings){ for(var k in b.settings){ if(d.settings[k]!==undefined) b.settings[k]=d.settings[k]; } }
  }catch(e){}
  return b;
}
var S = load();
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ say('이 기기에 저장하지 못했습니다. 인쇄나 내려받기로 보관해주세요.'); }
  }, 300);
}
function hasData(){
  return !!(S.name || S.oneLine || S.answers.some(function(a){ return a.first || a.final; }));
}
function slotGet(slot){
  if(slot==='oneline') return S.oneLine;
  var m = slot.match(/^q(\d)-(first|final)$/);
  return S.answers[+m[1]][m[2]];
}
function slotSet(slot, v){
  if(slot==='oneline'){ S.oneLine = v; }
  else{
    var m = slot.match(/^q(\d)-(first|final)$/);
    S.answers[+m[1]][m[2]] = v;
    if(v.trim()) S.answers[+m[1]].skipped = false;
  }
  save();
}
function slotLabel(slot){
  if(slot==='oneline') return '한문장';
  var m = slot.match(/^q(\d)-(first|final)$/);
  return '질문' + (+m[1]+1) + '_말하기';
}
function totalFinal(){
  return S.answers.reduce(function(n,a){ return n + a.final.trim().length; }, 0) + S.oneLine.trim().length;
}

/* ───────── 알림 ───────── */
var toastTimer = null;
function say(msg){
  live.textContent = '';
  clearTimeout(toastTimer);
  setTimeout(function(){ live.textContent = msg; }, 60);
  toastTimer = setTimeout(function(){ live.textContent = ''; }, 8000);
}

/* ───────── 신호음 ───────── */
var AC = null;
function beep(kind){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var tones = kind==='start' ? [[880,0,0.18]] : [[660,0,0.12],[440,0.16,0.2]];
    var t0 = AC.currentTime;
    tones.forEach(function(t){
      var o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = t[0];
      g.gain.setValueAtTime(0.0001, t0+t[1]);
      g.gain.exponentialRampToValueAtTime(0.25, t0+t[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+t[1]+t[2]);
      o.connect(g); g.connect(AC.destination);
      o.start(t0+t[1]); o.stop(t0+t[1]+t[2]+0.03);
    });
  }catch(e){}
}

/* ───────── 육성 보관 (이 기기 안) ───────── */
var DB = (function(){
  var dbp = null, mem = [];
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res){
      try{
        var rq = indexedDB.open('voice-story', 1);
        rq.onupgradeneeded = function(){ rq.result.createObjectStore('takes', {keyPath:'id', autoIncrement:true}); };
        rq.onsuccess = function(){ res(rq.result); };
        rq.onerror = function(){ res(null); };
      }catch(e){ res(null); }
    });
    return dbp;
  }
  function add(slot, blob){
    var rec = {slot:slot, blob:blob, type:blob.type, at:Date.now()};
    return open().then(function(db){
      if(!db){ mem.push(rec); return; }
      return new Promise(function(res){
        try{
          var tx = db.transaction('takes','readwrite');
          tx.objectStore('takes').add(rec);
          tx.oncomplete = function(){ res(); };
          tx.onerror = tx.onabort = function(){ mem.push(rec); res(); };
        }catch(e){ mem.push(rec); res(); }
      });
    });
  }
  function all(){
    return open().then(function(db){
      if(!db) return mem.slice();
      return new Promise(function(res){
        try{
          var rq = db.transaction('takes').objectStore('takes').getAll();
          rq.onsuccess = function(){ res((rq.result||[]).concat(mem)); };
          rq.onerror = function(){ res(mem.slice()); };
        }catch(e){ res(mem.slice()); }
      });
    });
  }
  function clear(slot){
    mem = slot ? mem.filter(function(r){ return r.slot!==slot; }) : [];
    return open().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        try{
          var tx = db.transaction('takes','readwrite'), st = tx.objectStore('takes');
          if(!slot){ st.clear(); }
          else{
            st.openCursor().onsuccess = function(e){
              var c = e.target.result; if(!c) return;
              if(c.value.slot===slot) c.delete();
              c.continue();
            };
          }
          tx.oncomplete = tx.onerror = tx.onabort = function(){ res(); };
        }catch(e){ res(); }
      });
    });
  }
  return {add:add, all:all, clear:clear};
})();

var urls = [];
function objURL(blob){ var u = URL.createObjectURL(blob); urls.push(u); return u; }
function revokeURLs(){ urls.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} }); urls = []; }
function extOf(type){ return /mp4|aac|m4a/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm'; }

function renderTakes(slot){
  var box = main.querySelector('[data-takes="'+slot+'"]');
  if(!box) return;
  DB.all().then(function(list){
    list = list.filter(function(r){ return r.slot===slot; });
    if(!main.contains(box)) return;
    box.innerHTML = list.map(function(r,i){
      return '<div class="take"><span>내 목소리 녹음 '+(i+1)+'</span><audio controls preload="metadata" src="'+objURL(r.blob)+'" aria-label="내 목소리 녹음 '+(i+1)+' 다시 듣기"></audio></div>';
    }).join('');
  });
}

/* ───────── 말하기 (받아쓰기 + 육성 녹음) ───────── */
var R = null;
function setStatus(slot, msg){
  var el = main.querySelector('[data-status="'+slot+'"]');
  if(el) el.textContent = msg;
}
function recButton(slot){ return main.querySelector('[data-action="rec"][data-slot="'+slot+'"]'); }
function textArea(slot){ return main.querySelector('[data-text="'+slot+'"]'); }

function startRec(slot){
  if(R) stopRec(true);
  stopSpeak();
  var ta = textArea(slot), btn = recButton(slot);
  if(!ta || !btn) return;
  if(!SR && !(CAN_REC && S.settings.keepAudio)){
    setStatus(slot, '이 브라우저에서는 받아쓰기가 되지 않습니다. 크롬이나 엣지로 열어주세요. 아래 칸에 직접 적으실 수도 있습니다.');
    say('이 브라우저에서는 받아쓰기가 되지 않습니다.');
    return;
  }
  var base = ta.value.replace(/\s+$/,'');
  var r = { slot:slot, base: base ? base+' ' : '', fin:'', sr:null, mr:null, stream:null, chunks:[], fatal:false };
  R = r;
  btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); btn.textContent = '■ 말하기 멈춤';
  ta.readOnly = true;
  setStatus(slot, SR ? '듣고 있습니다. 편하게 말씀하세요.' : '녹음하고 있습니다. 이 브라우저는 받아쓰기가 되지 않아 목소리만 저장합니다.');
  say('말하기를 시작합니다.');

  if(SR) startSR(r);
  beep('start');

  if(CAN_REC && S.settings.keepAudio){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(R !== r){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      r.stream = stream;
      var mime = ['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].filter(function(m){
        try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; }
      })[0];
      var mr = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
      r.mr = mr;
      mr.ondataavailable = function(e){ if(e.data && e.data.size) r.chunks.push(e.data); };
      mr.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        if(!r.chunks.length) return;
        var blob = new Blob(r.chunks, {type: mr.mimeType || mime || 'audio/webm'});
        DB.add(r.slot, blob).then(function(){ renderTakes(r.slot); });
      };
      mr.start(1000);
    }).catch(function(){
      if(R === r){
        setStatus(slot, SR ? '마이크 녹음은 허용되지 않아 받아쓰기만 합니다.' : '마이크를 쓸 수 없습니다. 브라우저 주소창에서 마이크를 허용해주세요.');
        if(!SR) stopRec(true);
      }
    });
  }
}

function startSR(r){
  var sr = new SR();
  r.sr = sr;
  sr.lang = 'ko-KR';
  sr.interimResults = true;
  sr.continuous = !IS_MOBILE;
  sr.onresult = function(e){
    var interim = '';
    for(var i=e.resultIndex; i<e.results.length; i++){
      var t = e.results[i][0].transcript;
      if(e.results[i].isFinal){ var tt = t.trim(); if(tt) r.fin += tt + ' '; }
      else interim += t;
    }
    var ta = textArea(r.slot);
    var v = r.base + r.fin + interim;
    if(ta){ ta.value = v; ta.scrollTop = ta.scrollHeight; }
    slotSet(r.slot, (r.base + r.fin).trim());
    updateCounts();
  };
  sr.onerror = function(e){
    if(e.error === 'no-speech' || e.error === 'aborted') return;
    r.fatal = true;
    var msg = '받아쓰기가 멈췄습니다. 다시 시작해주세요.';
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = '마이크가 허용되지 않았습니다. 브라우저 주소창에서 마이크를 허용한 뒤 다시 눌러주세요.';
    else if(e.error === 'network') msg = '인터넷 연결이 끊겨 받아쓰기가 멈췄습니다. 연결을 확인한 뒤 다시 눌러주세요.';
    else if(e.error === 'audio-capture') msg = '마이크를 찾지 못했습니다. 마이크가 연결되어 있는지 확인해주세요.';
    if(R === r){ stopRec(true); setStatus(r.slot, msg); say(msg); }
  };
  sr.onend = function(){
    if(R === r && !r.fatal){
      try{ sr.start(); }
      catch(err){ setTimeout(function(){ if(R === r){ try{ sr.start(); }catch(e2){} } }, 400); }
    }
  };
  try{ sr.start(); }catch(e){}
}

function stopRec(quiet){
  var r = R;
  if(!r) return;
  R = null;
  if(r.sr){ try{ r.sr.stop(); }catch(e){} }
  if(r.mr && r.mr.state !== 'inactive'){ try{ r.mr.stop(); }catch(e){} }
  else if(r.stream){ r.stream.getTracks().forEach(function(t){ t.stop(); }); }
  var btn = recButton(r.slot), ta = textArea(r.slot);
  if(btn){ btn.classList.remove('on'); btn.setAttribute('aria-pressed','false'); btn.textContent = '● 말하기 시작'; }
  if(ta){
    ta.readOnly = false;
    setTimeout(function(){
      var t2 = textArea(r.slot);
      if(t2 && !t2.readOnly){ t2.value = slotGet(r.slot); updateCounts(); if(view==='finish') refreshSheet(); }
    }, 900);
  }
  if(!quiet){
    beep('stop');
    setStatus(r.slot, '멈췄습니다. 받아쓴 글을 읽어드리고 확인해주세요.');
    say('말하기를 멈췄습니다.');
  }
}

function chunks(text){
  var out = [];
  (text.match(/[^.!?\n]+[.!?]*\n?/g) || []).forEach(function(s){
    s = s.trim();
    while(s.length > 110){
      var cut = s.lastIndexOf(' ', 110);
      if(cut < 40) cut = 110;
      out.push(s.slice(0, cut)); s = s.slice(cut).trim();
    }
    if(s) out.push(s);
  });
  return out;
}
function speak(text){
  stopSpeak();
  if(!('speechSynthesis' in window)){ say('이 기기에서는 읽어주기가 되지 않습니다. 돕는 분이 직접 읽어주세요.'); return; }
  var parts = chunks(text || '');
  if(!parts.length){ say('읽을 글이 아직 없습니다.'); return; }
  var voice = null;
  try{ voice = speechSynthesis.getVoices().filter(function(v){ return /^ko/i.test(v.lang); })[0] || null; }catch(e){}
  parts.forEach(function(p){
    var u = new SpeechSynthesisUtterance(p);
    u.lang = 'ko-KR'; if(voice) u.voice = voice;
    u.rate = S.settings.rate;
    speechSynthesis.speak(u);
  });
}

try{ if('speechSynthesis' in window) speechSynthesis.getVoices(); }catch(e){}

function exportText(){
  var name = S.name.trim(), mask = S.settings.maskName && name.length >= 2;
  var m = function(t){ return mask ? t.split(name).join('○○') : t; };
  var out = [criteria(), '', '────────────────', '[이야기]',
    '이야기한 사람: ' + (mask ? '○○' : (name || '이름을 적지 않음')),
    '기록한 날: ' + today(), ''];
  QUESTIONS.forEach(function(q,i){
    var t = S.answers[i].first.trim();
    out.push('질문 '+(i+1)+'. '+q.q);
    out.push('받아쓴 말: ' + (t ? m(t) : '(말하지 않음)'));
    out.push('');
  });
  if(S.oneLine.trim()) out.push('나의 삶을 한 문장으로: ' + m(S.oneLine.trim()));
  return out.join('\n');
}
function hasStory(){ return !!(S.oneLine.trim() || S.answers.some(function(a){ return a.first.trim(); })); }
function downloadAI(){
  if(!hasStory()){ say('아직 받아쓴 이야기가 없습니다.'); return; }
  var name = S.name.trim(), mask = S.settings.maskName && name.length >= 2;
  var blob = new Blob(['\uFEFF' + exportText().replace(/\n/g,'\r\n')], {type:'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = objURL(blob);
  a.download = ((mask || !name) ? '나의이야기' : name.replace(/\s+/g,'')) + '_AI에게줄글.txt';
  document.body.appendChild(a); a.click(); a.remove();
  say('파일을 내려받았습니다. 쓰시는 챗봇에 올려주세요.');
}
function copyAI(){
  if(!hasStory()){ say('아직 받아쓴 이야기가 없습니다.'); return; }
  var t = exportText();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove();
    say(ok ? '복사했습니다. 쓰시는 챗봇에 붙여넣어 주세요.' : '복사하지 못했습니다. 파일로 내려받아 주세요.');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ say('복사했습니다. 쓰시는 챗봇에 붙여넣어 주세요.'); }, fallback);
  }else fallback();
}

/* ───────── 마친 뒤 ───────── */
function today(){ var d = new Date(); return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; }
function sheetHTML(){
  var name = S.name.trim(), helper = S.helper.trim(), one = S.oneLine.trim();
  var body = QUESTIONS.map(function(q,i){
    var t = S.answers[i].first.trim();
    return t ? '<div class="sh-sec"><h4>'+esc(q.head)+'</h4><p>'+esc(t).replace(/\n+/g,'<br>')+'</p></div>' : '';
  }).join('');
  return '<div class="sheet-body">' +
    '<div class="sh-head"><p class="sh-kicker">나의 목소리, 한 장의 이야기</p>' +
    '<h3 class="sh-name">'+(name ? esc(name)+'의 삶' : '나의 삶')+'</h3></div>' +
    body +
    (one ? '<p class="sh-quote">“'+esc(one)+'”</p>' : '') +
    '<p class="sh-foot">'+today()+(name ? ' '+esc(name)+'의 목소리로 기록함' : ' 목소리로 기록함') +
    (helper ? '<br>받아 적은 이 '+esc(helper) : '')+'</p>' +
  '</div>';
}
function readAllText(){
  var name = S.name.trim();
  var parts = [(name ? name+'의 삶.' : '나의 삶.')];
  QUESTIONS.forEach(function(q,i){ var t = S.answers[i].first.trim(); if(t) parts.push(q.head+'.', t); });
  if(S.oneLine.trim()) parts.push('나의 삶을 한 문장으로.', S.oneLine.trim());
  return parts.join('\n');
}

function renderFinish(){
  var list = QUESTIONS.map(function(q,i){
    var a = S.answers[i];
    var st = a.first.trim() ? '말함' : (a.skipped ? '건너뜀' : '비어 있음');
    return '<button class="btn" type="button" data-action="goto" data-step="'+i+'">'+ORD[i]+' 번째 질문 '+q.key+', '+st+'</button>';
  }).join('');
  main.innerHTML =
    '<h1 class="title" id="view-title" tabindex="-1">이야기를 마쳤습니다</h1>' +
    '<p class="lead">긴 이야기 들려주셔서 고맙습니다. 받아쓴 글을 처음부터 끝까지 들어보시고, 더 하고 싶은 말이 있으면 그 질문으로 돌아가 이어서 말씀해주세요.</p>' +
    '<div class="row">' +
      '<button class="btn primary big" type="button" data-action="readall">처음부터 끝까지 읽어주기</button>' +
      '<button class="btn big" type="button" data-action="stopspeak">읽기 멈춤</button>' +
    '</div>' +
    panel({ slot:'oneline', title:'나의 삶을 한 문장으로', rows:2,
      desc:'마지막으로, 나의 삶을 한 문장으로 말한다면 어떻게 될까요? "나는 무엇무엇 한 사람이었다"처럼 말씀하셔도 좋습니다. 건너뛰어도 됩니다.',
      label:'한 문장', hint:'말씀하신 그대로 적습니다', speakLabel:'한 문장 읽어주기' }) +
    '<section class="box" aria-labelledby="h-ai">' +
      '<h2 class="h2" id="h-ai">AI로 다듬어 한 장으로 만들기</h2>' +
      '<p>글을 다듬는 일은 평소 쓰시는 챗봇에서 합니다. 챗GPT, 클로드, 제미나이 어느 것이든 됩니다. 받아쓴 이야기와 다듬는 기준을 한 묶음으로 드립니다.</p>' +
      '<ol class="plain-list">' +
        '<li>먼저 말한 분께 여쭤봐 주세요. "이 글을 다듬으려고 AI 회사의 챗봇에 보내려고 합니다. 괜찮으신가요?" 싫다고 하시면 보내지 않습니다.</li>' +
        '<li>아래 단추로 파일을 내려받거나 글을 복사합니다.</li>' +
        '<li>챗봇에 파일을 올리거나 글을 붙여넣습니다. 따로 부탁하는 말을 적지 않아도 됩니다.</li>' +
        '<li>챗봇이 만든 한 장을 소리 내어 읽어드립니다. 빠진 이야기 가운데 되살릴 것, 잘못 받아쓴 낱말을 챗봇에 알려주고 고칩니다.</li>' +
        '<li>말한 분이 좋다고 하시면 챗봇에서 인쇄하거나 문서로 옮겨 인쇄합니다.</li>' +
      '</ol>' +
      '<label class="choice"><input type="checkbox" data-setting="maskName"'+(S.settings.maskName?' checked':'')+'> 말한 분의 이름을 ○○로 가려서 보내기</label>' +
      '<p class="note">가려서 보냈다면 인쇄하기 전에 ○○ 자리에 이름을 적어 넣어주세요. 가족 이름이나 사는 곳은 자동으로 가려지지 않으니, 보내기 전에 받아쓴 글에서 살펴봐 주세요.</p>' +
      '<div class="stack">' +
        '<button class="btn primary big wide" type="button" data-action="dlai">이야기와 다듬는 기준 내려받기</button>' +
        '<button class="btn big wide" type="button" data-action="copyai">이야기와 다듬는 기준 복사하기</button>' +
      '</div>' +
      '<details><summary class="choice">다듬는 기준 읽어보기</summary><p class="criteria">'+esc(criteria())+'</p></details>' +
      '<p class="note">챗봇 설정에서 대화를 학습에 쓰지 않도록 꺼둘 수 있는지 확인해 주세요.</p>' +
    '</section>' +
    '<section class="box" aria-labelledby="h-print">' +
      '<h2 class="h2" id="h-print">AI 없이 받아쓴 그대로 인쇄하기</h2>' +
      '<p>다듬지 않고 말한 그대로 남기고 싶을 때 씁니다. 분량에 따라 여러 장이 될 수 있습니다.</p>' +
      '<label class="choice"><input type="checkbox" data-setting="largePrint"'+(S.settings.largePrint?' checked':'')+'> 큰 글자로 인쇄하기 (저시력용)</label>' +
      '<button class="btn wide" type="button" data-action="print">인쇄하기, 또는 PDF로 저장하기</button>' +
    '</section>' +
    '<section class="box" aria-labelledby="h-keep">' +
      '<h2 class="h2" id="h-keep">목소리 보관하기</h2>' +
      '<p>말할 때 녹음된 목소리를 하나씩 내려받습니다.</p>' +
      '<div class="stack" data-audio-list></div>' +
    '</section>' +
    '<section class="box" aria-labelledby="h-edit">' +
      '<h2 class="h2" id="h-edit">질문으로 돌아가기</h2>' +
      '<div class="stack">'+list+'</div>' +
    '</section>' +
    '<button class="btn" type="button" data-action="reset">모든 기록 지우고 처음부터</button>';
  renderTakes('oneline');
  DB.all().then(function(all){
    var box = main.querySelector('[data-audio-list]');
    if(!box) return;
    if(!all.length){ box.innerHTML = '<p class="note">저장된 목소리 녹음이 없습니다.</p>'; return; }
    var n = {};
    box.innerHTML = all.map(function(r){
      n[r.slot] = (n[r.slot]||0) + 1;
      var label = slotLabel(r.slot).replace(/_/g,' ') + ' 녹음 ' + n[r.slot];
      var file = (S.name.trim()||'나의이야기') + '_' + slotLabel(r.slot) + '_' + n[r.slot] + '.' + extOf(r.type||'');
      return '<a class="btn wide" download="'+esc(file)+'" href="'+objURL(r.blob)+'">'+esc(label)+' 내려받기</a>';
    }).join('');
  });
}

function doPrint(){
  stopSpeak();
  if(!hasStory()){ say('아직 인쇄할 이야기가 없습니다.'); return; }
  printRoot.innerHTML = '<div class="sheet'+(S.settings.largePrint?' large':'')+'">'+sheetHTML()+'</div>';
  setTimeout(function(){ window.print(); }, 100);
}

/* ───────── 동작 ───────── */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var act = el.getAttribute('data-action'), slot = el.getAttribute('data-slot');
  switch(act){
    case 'home': go('home'); break;
    case 'smaller': S.settings.size = Math.max(0, S.settings.size-1); applySettings(); save(); if(view==='finish') scalePreview(); say('글자를 줄였습니다.'); break;
    case 'bigger': S.settings.size = Math.min(3, S.settings.size+1); applySettings(); save(); if(view==='finish') scalePreview(); say('글자를 키웠습니다.'); break;
    case 'theme': S.settings.theme = S.settings.theme==='dark' ? 'light' : 'dark'; applySettings(); save(); say(S.settings.theme==='dark' ? '어두운 바탕으로 바꿨습니다.' : '밝은 바탕으로 바꿨습니다.'); break;
    case 'start': go('step', 0); break;
    case 'continue': go('step', S.step); break;
    case 'finish': go('finish'); break;
    case 'goto': go('step', +el.getAttribute('data-step')); break;
    case 'prev': if(S.step === 0) go('home'); else go('step', S.step-1); break;
    case 'next': if(S.step >= QUESTIONS.length-1) go('finish'); else go('step', S.step+1); break;
    case 'skip':
      var a = S.answers[S.step];
      if(!a.first.trim() && !a.final.trim()) a.skipped = true;
      save();
      if(S.step >= QUESTIONS.length-1) go('finish'); else go('step', S.step+1);
      say('건너뛰었습니다.');
      break;
    case 'rec': if(R && R.slot === slot) stopRec(false); else startRec(slot); break;
    case 'speak': stopRec(true); speak(slotGet(slot)); break;
    case 'speakq': stopRec(true); speak(QUESTIONS[S.step].q); break;
    case 'readall': stopRec(true); speak(readAllText()); break;
    case 'stopspeak': stopSpeak(); break;
    case 'clear':
      if(window.confirm('이 칸의 글과 목소리 녹음을 지울까요?')){
        stopRec(true); slotSet(slot, '');
        var ta = textArea(slot); if(ta) ta.value = '';
        DB.clear(slot).then(function(){ renderTakes(slot); });
        setStatus(slot, '지웠습니다. 다시 말씀해주세요.');
        updateCounts(); if(view==='finish') refreshSheet();
        say('지웠습니다.');
      }
      break;
    case 'print': doPrint(); break;
    case 'dlai': downloadAI(); break;
    case 'copyai': copyAI(); break;
    case 'reset':
      if(window.confirm('이 기기에 저장된 이야기와 목소리 녹음을 모두 지울까요? 되돌릴 수 없습니다.')){
        stopRec(true); stopSpeak();
        var keep = S.settings;
        try{ localStorage.removeItem(KEY); }catch(err){}
        S = blank(); S.settings = keep; save();
        DB.clear().then(function(){ go('home'); say('모든 기록을 지웠습니다.'); });
      }
      break;
  }
});

var sheetTimer = null;
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.matches('[data-text]')){
    slotSet(t.getAttribute('data-text'), t.value);
    updateCounts();
    if(view==='finish'){ clearTimeout(sheetTimer); sheetTimer = setTimeout(refreshSheet, 300); }
  }else if(t.matches('[data-field]')){
    S[t.getAttribute('data-field')] = t.value; save();
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.name === 'rate'){ S.settings.rate = parseFloat(t.value); save(); }
  else if(t.matches('[data-setting]')){
    S.settings[t.getAttribute('data-setting')] = t.checked; save();
    if(view==='finish') refreshSheet();
  }
});
window.addEventListener('resize', function(){ if(view==='finish') scalePreview(); });
window.addEventListener('pagehide', function(){ stopRec(true); stopSpeak(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });

applySettings();
renderHome();
})();
</script>
</body>
</html>
